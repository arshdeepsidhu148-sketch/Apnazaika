<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApnaZaika — Menu</title>
<style>body{font-family:Arial;background:#fffaf3;margin:0}header{background:#d84315;color:#fff;padding:12px;text-align:center} .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:12px} .card{width:220px;background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);padding:8px;text-align:center} img{width:100%;height:140px;object-fit:cover;border-radius:8px} button{background:#25D366;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;cursor:pointer}</style>
</head><body>
<header><h1>ApnaZaika Menu</h1></header>
<div style="padding:10px;text-align:center"><a href="index.html">← Back</a></div>
<div id="grid" class="grid"></div>
<script>
// phone (without +) and sample initial items
const phone = "916239046449";
let items = JSON.parse(localStorage.getItem('apn_items') || 'null');
if(!items){
  items = [
    {id:1,name:'Chicken Biryani',price:160,img:'https://i.ibb.co/6J0Y9mC/biryani.jpg'},
    {id:2,name:'Veg Pizza',price:150,img:'https://i.ibb.co/7VZ3x4Q/pizza.jpg'},
    {id:3,name:'Punjabi Burger',price:99,img:'https://i.ibb.co/1X3cnJ4/burger.jpg'}
  ];
  localStorage.setItem('apn_items', JSON.stringify(items));
}
function render(){
  const g=document.getElementById('grid'); g.innerHTML='';
  items.forEach(it=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<img src="${it.img}" alt=""><h3>${it.name}</h3><div>₹${it.price}</div>
      <div style="margin-top:8px">
        <button onclick="order('${it.name}',${it.price})">Order via WhatsApp</button>
      </div>`;
    g.appendChild(div);
  });
}
function order(name,price){
  const msg = encodeURIComponent(`Hello ApnaZaika 🍽️ I want to order: ${name} (₹${price}). Address: ____ . Contact: ____`);
  window.location.href = "https://wa.me/"+phone+"?text="+msg;
}
render();
</script>
</body></html>
