<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Zaika - Seller Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍴 Apna Zaika - Seller Dashboard</h1>
  </header>

  <main class="seller-container">
    <h2>Create Your Shop Account</h2>

    <div class="seller-form">
      <input type="text" id="shopName" placeholder="Enter your shop name">
      <input type="text" id="sellerName" placeholder="Your name">
      <input type="number" id="sellerPhone" placeholder="Mobile number">
      <input type="text" id="sellerAddress" placeholder="Full Address">
      <button id="createAccount">Create Account</button>
    </div>

    <hr>

    <h3>Upload Your Food Products</h3>
    <div class="product-upload">
      <input type="text" id="foodName" placeholder="Food name">
      <input type="number" id="foodPrice" placeholder="Price (₹)">
      <input type="url" id="foodImg" placeholder="Image URL">
      <button id="uploadProduct">Upload Product</button>
    </div>

    <div id="sellerProducts"></div>
  </main>

  <script src="seller.js"></script>
</body>
</html>
